name: Dependency Review

on: pull_request

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          # The project ships under GPLv3, so a dependency that cannot be
          # combined with it is a licensing defect, not a preference.
          deny-licenses: AGPL-1.0-only, AGPL-3.0-only, AGPL-3.0-or-later
